pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'mc-donate'

include 'common', 'coordinator', 'worker', 'client', 'bench'
